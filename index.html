<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>GifTastic</title>
    <!-- <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://w3.org viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎬</text></svg>"> -->
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js" defer></script>
    <script src="assets/js/app.js" type="text/javascript" defer></script>
</head>
<body id="top">
    <div id="wrapper">
        <header class="app-header">
            <h1 class="heading">GifTastic</h1>
            <p class="subtitle">Click any topic to load GIFs. Click a thumbnail to play or pause.</p>
        </header>

        <form id="add-topic-form">
            <label for="addBtnText" class="sr-only">Add Your Own GifTastic Buttons!</label>
            <input type="text" name="addButtonText" id="addBtnText" placeholder="Search or add a topic (e.g. Tina Fey)..." required>
            <button type="submit" id="addBtn">Add Button</button>
            <button type="button" id="trendingBtn" class="trending-btn">🔥 Trending</button>
            <button type="button" id="favoritesViewBtn" class="favorites-btn">♥ Favorites (<span id="favCount">0</span>)</button>
        </form>

        <section class="controls-grid">
            <div class="btnContainer">
                <div class="container-header">
                    <h4>Try These Buttons!</h4>
                </div>
                <div class="btnGroup"></div>
            </div>
            <div class="btnContainer">
                <div class="container-header">
                    <h4>Your Saved Buttons</h4>
                    <button type="button" class="resetBtn">Clear All</button>
                </div>
                <div class="usersButtons"></div>
            </div>
        </section>

        <section class="gallery-section">
            <div class="gallery-toolbar">
                <div class="toolbar-left">
                    <h2 id="active-topic-title">Showing: <span>Tina Fey</span></h2>
                    <span id="total-results">(<span id="resultsTotal">0</span> GIFs)</span>
                </div>
                <div class="toolbar-right">
                    <select id="ratingFilter" aria-label="Filter by rating">
                        <option value="all">All Ratings (G & PG)</option>
                        <option value="g">Rated G Only</option>
                        <option value="pg">Rated PG Only</option>
                    </select>
                    <button type="button" id="toggleAllBtn" class="secondary-action-btn">Play All</button>
                </div>
            </div>

            <div class="gifContainer"></div>

            <div class="load-more-wrapper">
                <button type="button" id="loadMoreBtn" class="load-more-btn">Load More GIFs</button>
            </div>
        </section>

        <footer>
            <a id="page-top" href="#top">↑ Back To Top</a>
            <span id="copyright">&copy; Copyright 2018</span>
        </footer>
    </div>

    <!-- Lightbox Modal -->
    <div id="gifModal" class="modal-overlay" aria-hidden="true">
        <div class="modal-box">
            <button type="button" id="closeModalBtn" class="modal-close" aria-label="Close preview">&times;</button>
            <img id="modalImg" src="" alt="Expanded GIF preview">
            <div class="modal-footer">
                <div class="modal-info">
                    <h3 id="modalTitle">GIF Title</h3>
                    <span id="modalMeta" class="rating-pill">PG</span>
                </div>
                <div class="modal-actions">
                    <button type="button" id="modalCopyBtn" class="copy-btn">Copy Direct Link</button>
                    <a id="modalGiphyLink" href="#" target="_blank" rel="noopener noreferrer">Open on GIPHY ↗</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
