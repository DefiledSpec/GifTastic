<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>GifTastic</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js" defer></script>
    <script src="assets/js/app.js" type="text/javascript" defer></script>
</head>
<body id="top">
    <div id="wrapper">
        <header class="app-header">
            <h1 class="heading">GifTastic</h1>
            <p class="subtitle">Click any topic to load GIFs. Click a thumbnail to play or pause.</p>
        </header>

        <form id="add-topic-form">
            <label for="addBtnText" class="sr-only">Add Your Own GifTastic Buttons!</label>
            <input type="text" name="addButtonText" id="addBtnText" placeholder="Search or add a topic (e.g. Tina Fey)..." required>
            <button type="submit" id="addBtn">Add Button</button>
            <button type="button" class="resetBtn">Reset Saved</button>
        </form>

        <section class="controls-grid">
            <div class="btnContainer">
                <h4>Try These Buttons!</h4>
                <div class="btnGroup"></div>
            </div>
            <div class="btnContainer">
                <h4>Your Saved Buttons</h4>
                <div class="usersButtons"></div>
            </div>
        </section>

        <section class="gallery-section">
            <div class="gallery-toolbar">
                <div class="toolbar-left">
                    <h2 id="active-topic-title">Showing: <span>Tina Fey</span></h2>
                    <span id="total-results">(<span id="resultsTotal">0</span> GIFs)</span>
                </div>
                <div class="toolbar-right">
                    <select id="ratingFilter" aria-label="Filter by rating">
                        <option value="all">All Ratings (G & PG)</option>
                        <option value="g">Rated G Only</option>
                        <option value="pg">Rated PG Only</option>
                    </select>
                    <button type="button" id="toggleAllBtn" class="secondary-action-btn">Play All</button>
                </div>
            </div>

            <div class="gifContainer"></div>
        </section>

        <footer>
            <a id="page-top" href="#top">↑ Back To Top</a>
            <span id="copyright">&copy; Copyright 2018</span>
        </footer>
    </div>
</body>
</html>
